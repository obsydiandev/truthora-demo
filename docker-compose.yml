services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3

  streamlit:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0

  benchmark:
    build: .
    profiles: [benchmark]
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    command: >
      python3 data/benchmark/evaluate.py
      --direct
      --verbose
      --output data/benchmark/results/baseline_v01.json

volumes:
  qdrant_storage:
  hf_cache:   # persists BGE-M3 (~4 GB) across container restarts — downloaded once on first use
